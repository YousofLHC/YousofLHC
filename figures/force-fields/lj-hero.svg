  <rect x="90" y="90" width="260" height="150" rx="10" fill="#0f1522" stroke="#52c7c0" stroke-width="1.3"/>
  <text x="220" y="118" text-anchor="middle" fill="#52c7c0" font-family="Fraunces, serif" font-size="16" font-weight="600">Ab initio MD</text>
  <text x="220" y="138" text-anchor="middle" fill="#93a0b4" font-family="JetBrains Mono, monospace" font-size="11">electronic structure, e.g. DFT</text>
  <text x="115" y="166" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· hundreds of atoms</text>
  <text x="115" y="186" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· hundreds of picoseconds</text>
  <text x="115" y="206" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· bonds can break and form</text>
  <text x="115" y="226" fill="#e2685c" font-family="Inter, sans-serif" font-size="12.5">Â· very expensive per step</text>
  <rect x="550" y="90" width="260" height="150" rx="10" fill="#0f1522" stroke="#e3a344" stroke-width="1.3"/>
  <text x="680" y="118" text-anchor="middle" fill="#e3a344" font-family="Fraunces, serif" font-size="16" font-weight="600">Empirical force field</text>
  <text x="680" y="138" text-anchor="middle" fill="#93a0b4" font-family="JetBrains Mono, monospace" font-size="11">classical, pre-fitted U(r)</text>
  <text x="575" y="166" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· up to millions of atoms</text>
  <text x="575" y="186" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· nano- to microseconds</text>
  <text x="575" y="206" fill="#e2685c" font-family="Inter, sans-serif" font-size="12.5">Â· bonds are unbreakable</text>
  <text x="575" y="226" fill="#d9dfe9" font-family="Inter, sans-serif" font-size="12.5">Â· orders of magnitude faster</text>
