<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050918"/><stop offset="1" stop-color="#0b1128"/>
    </linearGradient>
  </defs>
  <rect width="820" height="420" fill="url(#bg)"/>
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#e8edff">Acetylsalicylic acid (aspirin) — aspirin</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#8b93b0">skeletal formula · atoms are nodes, bonds are edges — the same graph a GNN sees</text>

  <g transform="translate(340 220)" stroke="#dce6ff" stroke-width="3" fill="none">
    <!-- hexagon -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" />
    <!-- aromatic circle -->
    <circle r="60" stroke="#3be1ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  </g>

  <g transform="translate(340 220)" font-size="15" fill="#dce6ff" text-anchor="middle" stroke="none">
    <!-- carboxyl at right vertex -->
    <line x1="86.6" y1="50" x2="160" y2="60" stroke="#dce6ff" stroke-width="3"/>
    <text x="212" y="58" font-size="16" fill="#3be1ff">C(=O)OH</text>
    <text x="208" y="88" font-size="11" fill="#8b93b0">(carboxyl)</text>
    <line x1="160" y1="60" x2="200" y2="58" stroke="#dce6ff" stroke-width="3"/>

    <!-- ester at left vertex -->
    <line x1="-86.6" y1="-50" x2="-150" y2="-90" stroke="#dce6ff" stroke-width="3"/>
    <text x="-200" y="-80" font-size="16" fill="#f472b6">O</text>
    <line x1="-150" y1="-90" x2="-205" y2="-120" stroke="#dce6ff" stroke-width="3"/>
    <text x="-235" y="-120" font-size="16" fill="#f472b6">C(=O)</text>
    <line x1="-205" y1="-120" x2="-260" y2="-105" stroke="#dce6ff" stroke-width="3"/>
    <text x="-310" y="-108" font-size="16" fill="#34d399">CH₃</text>
    <text x="-225" y="-48" font-size="11" fill="#8b93b0">(ester)</text>
  </g>

  <!-- right side: ML panel -->
  <g transform="translate(560 90)">
    <rect width="230" height="250" rx="14" fill="#0a0f24" stroke="#a78bfa55"/>
    <text x="115" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">Graph view</text>
    <text x="115" y="58" text-anchor="middle" font-size="11" fill="#9aa4c7" font-family="JetBrains Mono, monospace">nodes = 13 atoms</text>
    <text x="115" y="78" text-anchor="middle" font-size="11" fill="#9aa4c7" font-family="JetBrains Mono, monospace">edges = 13 bonds</text>
    <text x="115" y="98" text-anchor="middle" font-size="11" fill="#9aa4c7" font-family="JetBrains Mono, monospace">+ feature vectors</text>
    <line x1="30" y1="118" x2="200" y2="118" stroke="#1a2140"/>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#dce6ff">GNN message passing</text>
    <text x="115" y="178" text-anchor="middle" font-size="11" fill="#9aa4c7">h_u ← UPD(h_u, Σ MSG(h_v))</text>
    <text x="115" y="210" text-anchor="middle" font-size="12" fill="#dce6ff">readout → ŷ = logP</text>
    <text x="115" y="236" text-anchor="middle" font-size="11" fill="#34d399">see notebook: gnn-molecular-…</text>
  </g>
</svg>
